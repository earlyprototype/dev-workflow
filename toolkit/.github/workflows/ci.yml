# The required checks job always exercises the toolkit guards.
# Set the repository variable RUN_NPM_CHECKS to true to include the npm app.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Review-gate hook tests
        run: node .claude/hooks/tests/review-gate.test.cjs

      - name: Auto-merge eligibility (verdict) tests
        run: node .github/scripts/automerge-eligible.test.cjs

      - name: Review-watch classifier tests
        run: node .claude/hooks/tests/watch-review.test.cjs

      - name: Review-watch reminder hook tests
        run: node .claude/hooks/tests/watch-review-reminder.test.cjs

      - name: Check npm application
        if: vars.RUN_NPM_CHECKS == 'true'
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm run test:coverage
          npm run build
